name: goat_song
description: GOAT SONG - Le lecteur audio rétro Hi-Fi ultime. Un son d'exception, une ambiance cassette rétro et un personnalisateur de fond d'écran.
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- ARCHITECTURE & STATE MANAGEMENT ---
  flutter_bloc: ^8.1.3         # Gestion d'état Clean Architecture
  get_it: ^7.6.0               # Service Locator / Injection de dépendances
  equatable: ^2.0.5            # Comparaison d'objets pour les Blocs

  # --- MOTEUR AUDIO, EFFETS & CASSETTE ---
  just_audio: ^0.10.6          # Moteur principal, fondu enchaine & effets Android
  audioplayers: ^5.2.1         # Moteur secondaire pour effets sonores mécaniques (FX)
  audio_service: ^0.18.12      # Arrière-plan, Android Auto / CarPlay, Lockscreen & Wearables
  audio_session: ^0.1.18       # Gestion des interruptions (casque, appels)

  # --- CONNECTIVITÉ, STREAMING SANS FIL & AUTOMOBILE ---
  cast: ^2.0.1                 # Support natif Google Cast / Chromecast
  media_cast_dlna: ^0.3.1      # Decouverte et controle DLNA/UPnP vers ampli Hi-Fi
  flutter_carplay: ^1.6.4      # CarPlay et Android Auto pour le mode voiture

  # --- ÉDITION DE TAGS & FICHIERS AUDIO ---
  id3: ^1.0.1                  # Éditeur de tags ID3v1 & ID3v2 pour MP3/FLAC
  m3u_nullsafe: ^1.0.4         # Parsing, import et export de playlists .m3u / .m3u8

  # --- SAUVEGARDE & FICHIERS LOCALES ---
  archive: ^3.4.10             # Compression Zip pour export/import des sauvegardes JSON/BDD
  file_picker: ^8.0.0          # Sélection de dossiers/fichiers (Image fond personnalisée & Mode Dossier)
  permission_handler: ^11.3.0  # Gestion propre des permissions (Accès Photos/Stockage/Audio)

  # --- WIDGET & INTERACTIONS NATIVES ---
  home_widget: ^0.6.0          # Widget Écran d'accueil Android & iOS

  # --- THÈME DYNAMIQUE, GRAPHISME & ASSETS ---
  flutter_svg: ^2.0.10+1       # Rendu vectoriel SVG (Logos, Icônes UI)
  flex_color_picker: ^3.7.1     # Disque de selection pour la couleur secondaire
  palette_generator: ^0.3.3+3  # Extraction des couleurs de la pochette
  cached_network_image: ^3.3.1 # Cache des pochettes distantes
  flutter_spinkit: ^5.2.0      # Animations pour la cassette et chargeurs

  # --- TÉLÉCHARGEMENT DE POCHETTES & PAROLES ---
  http: ^1.2.0                 # Requêtes HTTP (APIs LRCLIB, Deezer, LastFM, Discogs)

  # --- SCAN MÉDIATHÈQUE & STOCKAGE BDD ---
  on_audio_query: ^2.9.0       # Scan rapide du téléphone
  hive: ^2.2.3                 # BDD NoSQL rapide (Favoris, Opacité, Choix de fond)
  hive_flutter: ^1.1.0         # Intégration Hive pour Flutter
  path_provider: ^2.1.2        # Accès aux répertoires locaux du téléphone

  # --- MONÉTISATION, ACHATS & MISES À JOUR ---
  google_mobile_ads: ^9.1.0    # AdMob (Bannieres, Interstitiels, Rewarded)
  in_app_purchase: ^3.2.0      # Achats In-App pour le mode Premium
  in_app_update: ^4.0.1        # Mises à jour in-app Play Store

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # --- OUTILS CLI DE GÉNÉRATION ---
  flutter_launcher_icons: ^0.13.1  # Génération automatique des icônes
  flutter_native_splash: ^2.4.0    # Splash Screen natif au lancement

# ===========================================================================
# CONFIGURATION DES ASSETS ET POLICES
# ===========================================================================
flutter:
  uses-material-design: true

  # Déclaration explicite de tous les dossiers de ressources
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/categories/
    - assets/images/wallpapers/
    - assets/languages/

# ===========================================================================
# CONFIGURATIONS ICÔNES ET SPLASH SCREEN NATIF (GOAT SONG)
# ===========================================================================
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/goat_song_logo_symbol.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icons/goat_song_logo_symbol.png"

flutter_native_splash:
  color: "#121212"
  image: "assets/icons/goat_song_logo.png"
  android_12:
    image: "assets/icons/goat_song_logo_symbol.png"
    icon_background_color: "#121212"

dependency_overrides:
  on_audio_query_android:
    path: third_party/on_audio_query_android
